name: Browser v2 detector tests
on: [push, pull_request]
jobs:
  detector:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: node --check browser/app.js
      - run: node --check browser/worker.js
      - run: python3 tools/export_browser_model.py
      - run: git diff --exit-code -- browser/models/
